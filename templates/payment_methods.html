<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Métodos de Pago</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    margin:0;
}

.container{
    max-width:700px;
    margin:auto;
    padding:30px;
}

.card{
    background:#1b1b1b;
    border-radius:15px;
    padding:25px;
    margin-top:30px;
}

h1{
    color:#4CAF50;
}

.dato{
    font-size:22px;
    margin:15px;
}

button{
    background:#4CAF50;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:10px;
    cursor:pointer;
    margin-top:20px;
}
</style>

</head>

<body>

<div class="container">

<h1>💳 MÉTODOS DE PAGO</h1>

<div class="card">

<div class="dato">
<b>Banco:</b><br>
BBVA
</div>

<div class="dato">
<b>Titular:</b><br>
Tu Nombre
</div>

<div class="dato">
<b>Tarjeta:</b><br>
0000 0000 0000 0000
</div>

<div class="dato">
<b>CLABE:</b><br>
000000000000000000
</div>

<button>Copiar CLABE</button>

</div>

</div>

</body>
</html>
